<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Fancy Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/product-details.css">
  <script src="./js/product.js" defer></script>
  <script src="./js/product-details.js" defer></script>
  <link rel="icon" type="image/png" href="./src/imgs/logo.png">
</head>

<body>
  <p class="aviso" style="font-family: fredoka;">Frete grátis acima de R$200</p>


  <header class="topo">

    <div class="topo__barra">
      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menu">
      <label for="menu-toggle" class="menu-botao" aria-hidden="true"><span></span></label>
      <a href="./index.html" class="logo" aria-label="Fancy Home">
        <img src="./src/imgs/logo.png" alt="Fancy Home" width="56" height="48">
      </a>
      <nav class="menu" aria-label="Principal">
        <a href="./index.html">Home</a>
        <details class="menu__dropdown">
          <summary>Shop
            <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true">
              <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </summary>
          <div class="menu__categorias">
            <a href="./shop.html?category=decoration">Decoração</a>
            <span aria-disabled="true">Móveis</span>
            <span aria-disabled="true">Cozinha</span>
          </div>
        </details>
        <a href="./contato.html">Contato</a>
        <a href="./sobre.html">Sobre</a>
      </nav>
      <form class="busca" role="search" action="./shop.html" method="GET">
        <input type="search" name="q" placeholder="Buscar produtos" aria-label="Buscar produtos">
        <button type="submit" aria-label="Buscar">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="m17 17 7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </form>
      <div class="acoes">
        <a href="./wishlist.html" aria-label="Favoritos">
          <svg width="22" height="20" viewBox="0 0 24 22" aria-hidden="true">
            <path
              d="M12 21 3 12C-.5 8.5 1 2 6.500 2c2.300 0 4 1.300 5.500 3C13.500 3.300 15.200 2 17.500 2 23 2 24.500 8.500 21 12z"
              fill="currentColor" />
          </svg>
        </a>
        <a href="./sh-bag.html" aria-label="Sacola">
          <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true">
            <path d="M2 7h18l1 15H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M7 10V6a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </a>
        <a href="./login.html" aria-label="Minha conta">
          <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true">
            <circle cx="11" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M1.500 23c0-5 4-8 9.500-8s9.500 3 9.500 8" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </a>
      </div>
    </div>

  </header>

  <main>

    <section class="product-detail" aria-labelledby="product-title">

      <div class="product-gallery">
        <div class="product-thumbnails" id="productThumbnails" aria-label="Fotos do produto"></div>
        <div class="product-main-image"><img id="productImage" src="" alt=""></div>
      </div>

      <div class="product-info">
        <div class="product-info__top">
          <h1 id="product-title">Carregando produto...</h1>
          <button type="button" class="wishlist-toggle" id="favoriteButton" aria-label="Adicionar aos favoritos"
            aria-pressed="false">
            <svg viewBox="0 0 24 22" width="25" height="23" aria-hidden="true">
              <path d="M12 21 3 12C-.5 8.5 1 2 6.5 2c2.3 0 4 1.3 5.5 3 1.5-1.7 3.2-3 5.5-3 5.5 0 7 6.5 3.5 10z"
                fill="none" stroke="currentColor" stroke-width="1.5" />
            </svg>
          </button>
        </div>
        <p class="product-description" id="productDescription"></p>
        <p class="product-price" id="productPrice"></p>
        <button type="button" class="product-cart" id="addToBag" style="font-family: fredoka;">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1 2h4l3 13h11l3-9H6.5" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round" />
            <circle cx="9.5" cy="20" r="1.7" fill="currentColor" />
            <circle cx="18" cy="20" r="1.7" fill="currentColor" />
          </svg>
          Adicionar à sacola
        </button>
        <p class="product-feedback" id="productFeedback" aria-live="polite"></p>
      </div>

    </section>


    <section class="recommended-section">
      <div class="recommended-title"><i aria-hidden="true">✦</i>
        <h2>Você também pode gostar</h2><i aria-hidden="true">✦</i>
      </div>
      <ul class="recommended-grid" id="recommendedProducts"></ul>
    </section>


  </main>
</body>

</html>
