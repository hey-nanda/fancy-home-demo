<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist | Fancy Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/wishlist.css">

<script src="./js/product.js" defer></script>
<script src="./js/wishlist.js" defer></script>
</head>
<body>

  <p class="aviso">Frete grátis acima de R$200</p>

  <header class="topo">

    <div class="topo__barra">
      <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menu">
      <label for="menu-toggle" class="menu-botao" aria-hidden="true"><span></span></label>
      <a href="./index.html" class="logo" aria-label="Fancy Home">
        <img src="../src/imgs/logo.png" alt="Fancy Home" width="56" height="48">
      </a>
      <nav class="menu" aria-label="Principal">
        <a href="./index.html">Home</a>
        <details class="menu__dropdown">
          <summary>Shop
            <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true">
              <path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
          </summary>
          <div class="menu__categorias">
            <a href="./shop.html?category=decoration">Decoração</a>
            <span aria-disabled="true">Móveis</span>
            <span aria-disabled="true">Cozinha</span>
          </div>
        </details>
        <a href="./contato.html">Contato</a>
        <a href="./sobre.html">Sobre</a>
      </nav>
      <form class="busca" role="search" action="./shop.html" method="GET">
        <input type="search" name="q" placeholder="Buscar produtos" aria-label="Buscar produtos">
        <button type="submit" aria-label="Buscar">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
            <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="m17 17 7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
      </form>
      <div class="acoes">
        <a href="./wishlist.html" aria-label="Favoritos">
          <svg width="22" height="20" viewBox="0 0 24 22" aria-hidden="true">
            <path
              d="M12 21 3 12C-.5 8.5 1 2 6.500 2c2.300 0 4 1.300 5.500 3C13.500 3.300 15.200 2 17.500 2 23 2 24.500 8.500 21 12z"
              fill="currentColor" />
          </svg>
        </a>
        <a href="./sh-bag.html" aria-label="Sacola">
          <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true">
            <path d="M2 7h18l1 15H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M7 10V6a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </a>
        <a href="./login.html" aria-label="Minha conta">
          <svg width="22" height="24" viewBox="0 0 22 24" aria-hidden="true">
            <circle cx="11" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M1.500 23c0-5 4-8 9.500-8s9.500 3 9.500 8" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </a>
      </div>
    </div>

  </header>

  <main>
    <h1 class="sr-only">Minha wishlist</h1>

    <section class="wishlist" aria-label="Itens da wishlist">

    <ul class="miniaturas" id="wishlist-thumbnails">

    </ul>

    <div class="divisor"></div>

    <div class="painel" id="wishlist-panel">

    </div>

</section>

  </main>

</body>
</html>
